name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev,web]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m black --check .
      - run: python -m mypy
      - run: python -m pyright
      - run: python -m pylint src tests

  # Studio's JavaScript and CSS: Biome, native Node unit tests and Fallow.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2' 'PyYAML>=6,<7'
      - run: python -m build
      - run: python tests/check_distribution.py dist
      - name: Install the built wheel
        shell: bash
        run: |
          jamshoot_wheels=(dist/*.whl)
          python -m pip install "${jamshoot_wheels[0]}[web]"
      # Text renders with an installed sans-serif font; Linux runners get DejaVu Sans.
      - name: Install the default font
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes --no-install-recommends fonts-dejavu-core
      - run: python -m unittest discover -s tests -v
      - run: jamshoot --version
